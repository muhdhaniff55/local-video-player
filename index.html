<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlayer | Private Cinema</title>
    
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    
    <style>
        :root {
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --bg: #0b0e14;
            --surface: #161b22;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 40px 0;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin: 0;
            background: linear-gradient(to right, #fff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-dim);
            margin-top: 8px;
        }

        .drop-card {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border: 2px dashed #30363d;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 30px;
        }

        .drop-card:hover, .drop-card.dragover {
            border-color: var(--accent);
            background: #1c2128;
            transform: translateY(-2px);
        }

        #fileInput { display: none; }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        #status-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .file-name { color: var(--text-dim); font-style: italic; }

        .btn-resync {
            background: transparent;
            border: 1px solid #30363d;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }

        .btn-resync:hover { color: white; border-color: var(--text-dim); }

        /* ---------- Anime4K enhance card (lives on the page, not in the player) ---------- */
        #enhance-card {
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            background: var(--surface);
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .enhance-info { display: flex; flex-direction: column; gap: 2px; }
        .enhance-title { font-weight: 600; }
        .enhance-sub { color: var(--text-dim); font-size: 0.8rem; }

        .enhance-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        .enhance-desc {
            flex-basis: 100%;
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.5;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }

        .enhance-controls select {
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .switch { position: relative; width: 46px; height: 26px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0;
            background: #30363d;
            border-radius: 26px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 20px; width: 20px;
            left: 3px; top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider::before { transform: translateX(20px); }
        .switch input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }

        /* Upscaled canvas sits on top of the video picture; player controls stay usable above it */
        .video-js canvas.anime4k-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            pointer-events: none;
            z-index: 1;
        }
        .video-js.anime4k-on video.vjs-tech { opacity: 0; }
        .video-js.anime4k-on .vjs-control-bar,
        .video-js.anime4k-on .vjs-big-play-button,
        .video-js.anime4k-on .vjs-loading-spinner { z-index: 3; }

        #enhance-panel {
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #30363d;
            background: #000;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            display: none;
            position: relative;
        }

        #enhance-panel canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .enhance-badge {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(6px);
            border: 1px solid #30363d;
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 999px;
        }

        #player-shelf {
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid #30363d;
            background: #000;
            display: none; 
        }

        .video-js {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .vjs-theme-fantasy .vjs-play-progress { background-color: var(--accent); }
        .vjs-theme-fantasy .vjs-control-bar { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <header>
        <h1>NovaPlayer</h1>
        <p class="subtitle">Private, local playback without tracking.</p>
    </header>
    
    <div class="drop-card" id="dropZone">
        <div id="drop-text">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:15px; opacity:0.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p>Drop a movie file here to start streaming</p>
        </div>
        <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Select File</button>
        <input type="file" id="fileInput" accept="video/*">
    </div>

    <div id="status-bar">
        <span class="file-name" id="fileNameDisplay">No file selected</span>
        <button id="resyncBtn" class="btn-resync">Fix Audio Lag</button>
    </div>

    <!-- Upscaler toggle (page-level, outside the player) -->
    <div id="enhance-card">
        <div class="enhance-info">
            <span class="enhance-title">Upscaler</span>
            <span class="enhance-sub" id="enhanceStatus">Sharpens video edges for anime &amp; cartoons</span>
        </div>
        <div class="enhance-controls">
            <select id="engineSelect" title="Upscaler engine">
                <option value="webgl">WebGL Lite (light)</option>
                <option value="webgpu">WebGPU Anime4K (heavy)</option>
            </select>
            <select id="strengthSelect" title="WebGL sharpening strength">
                <option value="0.5">Soft</option>
                <option value="0.8" selected>Normal</option>
                <option value="1.0">Strong</option>
            </select>
            <select id="modeSelect" title="Anime4K preset" style="display:none">
                <option value="ModeA">Mode A (balanced)</option>
                <option value="ModeB">Mode B (soft sources)</option>
                <option value="ModeC">Mode C (denoise)</option>
                <option value="ModeAA">Mode A+A (high)</option>
                <option value="ModeBB">Mode B+B (high)</option>
                <option value="ModeCA">Mode C+A (high)</option>
            </select>
            <label class="switch" title="Toggle upscaler">
                <input type="checkbox" id="enhanceToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="enhance-desc" id="modeDesc"></div>
    </div>

    <div id="player-shelf">
        <video 
            id="mainPlayer" 
            class="video-js vjs-theme-fantasy vjs-big-play-centered" 
            controls 
            preload="metadata"
            playsinline
            muted
        ></video>
    </div>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const resyncBtn = document.getElementById('resyncBtn');
        const playerShelf = document.getElementById('player-shelf');
        const enhanceCard = document.getElementById('enhance-card');
        
        const player = videojs('mainPlayer', {
            playbackRates: [0.5, 1, 1.25, 1.5, 2],
            fluid: true,
            responsive: true
        });

        let currentFile = null;
        let objectURL = null;

        function loadVideo(file) {
            if (!file) return;
            
            currentFile = file;
            
            fileNameDisplay.textContent = `Streaming: ${file.name}`;
            playerShelf.style.display = 'block';
            resyncBtn.style.display = 'block';
            enhanceCard.style.display = 'flex';
            dropZone.style.padding = '20px'; 

            if (objectURL) URL.revokeObjectURL(objectURL);
            objectURL = URL.createObjectURL(file);

            player.src({ type: file.type, src: objectURL });
            
            player.ready(() => {
                player.play().catch(() => {
                    fileNameDisplay.textContent = "Click play to start (Autoplay blocked)";
                });
            });

            playerShelf.scrollIntoView({ behavior: 'smooth' });
        }

        resyncBtn.addEventListener('click', () => {
            const currentTime = player.currentTime();
            const isPaused = player.paused();

            player.pause();
            player.currentTime(currentTime - 0.1); 
            
            setTimeout(() => {
                if (!isPaused) player.play();
                resyncBtn.textContent = "Resynced!";
                setTimeout(() => resyncBtn.textContent = "Fix Audio Lag", 2000);
            }, 100);
        });

        fileInput.addEventListener('change', (e) => loadVideo(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            dropZone.classList.add('dragover'); 
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadVideo(e.dataTransfer.files[0]);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                player.paused() ? player.play() : player.pause();
            }
        });
    </script>

    <!-- Upscaler: canvas drawn over the player's picture, fed by the player's video element -->
    <script type="module">
        const toggle = document.getElementById('enhanceToggle');
        const engineSelect = document.getElementById('engineSelect');
        const strengthSelect = document.getElementById('strengthSelect');
        const modeSelect = document.getElementById('modeSelect');
        const statusEl = document.getElementById('enhanceStatus');
        const modeDesc = document.getElementById('modeDesc');

        const ANIME4K_URL = 'https://cdn.jsdelivr.net/npm/anime4k-webgpu@1.0.0/+esm';
        const CDN_FALLBACKS = [
            ANIME4K_URL,
            'https://esm.sh/anime4k-webgpu@1.0.0',
            'https://unpkg.com/anime4k-webgpu@1.0.0?module'
        ];
        const MAX_OUTPUT_WIDTH = 2560;
        const IDLE_TEXT = 'Sharpens video edges for anime & cartoons';

        let lib = null;
        let canvas = null;
        let session = 0;     // bumps on every (re)start so stale async work is ignored
        let stopLoop = null; // stops the WebGL draw loop

        const getVideoEl = () => player.el().querySelector('video');
        const setStatus = (msg) => { statusEl.textContent = msg; };

        const MODE_INFO = {
            ModeA: '<b>Mode A – Balanced.</b> Best all-rounder for clean 1080p anime. Fixes slight blur, then upscales.',
            ModeB: '<b>Mode B – Soft sources.</b> For blurry or low-res video (e.g. 720p or scaled-up). Restores softness more strongly, then upscales.',
            ModeC: '<b>Mode C – Denoise.</b> For noisy or grainy video. Removes noise and upscales without much sharpening, so it looks cleaner and smoother.',
            ModeAA: '<b>Mode A+A – High quality.</b> Mode A with an extra restore pass. Sharper, but heavier on the GPU.',
            ModeBB: '<b>Mode B+B – High quality.</b> Mode B with an extra restore pass. Best for very soft video, but heavier on the GPU.',
            ModeCA: '<b>Mode C+A – High quality.</b> Denoise first, then sharpen and upscale. Best for noisy video, but heaviest on the GPU.'
        };
        const WEBGL_INFO = '<b>WebGL Lite – Light.</b> Smooth upscale plus an edge-sharpening filter that thins and crisps lines. Much lighter than WebGPU and works on any device with WebGL (including older iPhones). It is a simplified approach, not the full Anime4K neural network, so the result is cleaner lines rather than rebuilt detail.';

        // WebGPU availability
        const hasWebGPU = 'gpu' in navigator;
        if (!hasWebGPU) {
            const opt = engineSelect.querySelector('option[value="webgpu"]');
            opt.disabled = true;
            opt.textContent = 'WebGPU Anime4K (not supported here)';
            engineSelect.value = 'webgl';
        }

        function updateUI() {
            const gpu = engineSelect.value === 'webgpu';
            modeSelect.style.display = gpu ? '' : 'none';
            strengthSelect.style.display = gpu ? 'none' : '';
            modeDesc.innerHTML = gpu ? (MODE_INFO[modeSelect.value] || '') : WEBGL_INFO;
        }
        updateUI();

        // ---------- shared helpers ----------
        function getOutputSize(video) {
            const nativeW = video.videoWidth, nativeH = video.videoHeight;
            // Only render as many pixels as the screen can show. Never below native, never above 2x.
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const displayW = Math.round(player.el().clientWidth * dpr);
            let scale = Math.min(2, Math.max(1, displayW / nativeW));
            scale = Math.max(1, Math.min(scale, MAX_OUTPUT_WIDTH / nativeW));
            return { nativeW, nativeH, w: Math.round(nativeW * scale), h: Math.round(nativeH * scale) };
        }

        function attachCanvas(w, h) {
            canvas = document.createElement('canvas');
            canvas.className = 'anime4k-canvas';
            canvas.width = w;
            canvas.height = h;
            player.el().appendChild(canvas);
            player.addClass('anime4k-on');
        }

        function cleanup() {
            session++;
            if (stopLoop) { try { stopLoop(); } catch (e) {} stopLoop = null; }
            if (canvas) { canvas.remove(); canvas = null; }
            player.removeClass('anime4k-on');
        }

        // ---------- WebGL Lite engine ----------
        function startWebGL(video, size) {
            attachCanvas(size.w, size.h);
            const gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'low-power' });
            if (!gl) throw new Error('WebGL is not available on this device');

            const vsSrc = `
                attribute vec2 p;
                varying vec2 uv;
                void main() {
                    uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5);
                    gl_Position = vec4(p, 0.0, 1.0);
                }`;

            // Bilinear upscale (GPU linear filtering) + edge-aware "shock" sharpening:
            // pixels on an edge are pulled toward the nearest darkest/lightest neighbour,
            // which crisps and thins lines. Flat areas are left alone so noise isn't boosted.
            const fsSrc = `
                precision mediump float;
                varying vec2 uv;
                uniform sampler2D tex;
                uniform vec2 px;
                uniform float strength;
                float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
                void main() {
                    vec3 c = texture2D(tex, uv).rgb;
                    float l = lum(c);
                    vec3 cmin = c; vec3 cmax = c;
                    float lmin = l; float lmax = l;
                    for (int y = -1; y <= 1; y++) {
                        for (int x = -1; x <= 1; x++) {
                            vec3 s = texture2D(tex, uv + vec2(float(x), float(y)) * px).rgb;
                            float sl = lum(s);
                            if (sl < lmin) { lmin = sl; cmin = s; }
                            if (sl > lmax) { lmax = sl; cmax = s; }
                        }
                    }
                    float range = lmax - lmin;
                    float edge = smoothstep(0.05, 0.25, range);
                    float bias = clamp((lmax - l - (l - lmin)) / max(range, 0.001), -1.0, 1.0);
                    vec3 target = bias > 0.0 ? cmin : cmax;
                    float t = abs(bias) * edge * strength;
                    gl_FragColor = vec4(mix(c, target, t), 1.0);
                }`;

            const compile = (type, src) => {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader error: ' + gl.getShaderInfoLog(s));
                return s;
            };
            const prog = gl.createProgram();
            gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
            gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('Program link failed');
            gl.useProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'p');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

            // One output pixel expressed in source UV space
            gl.uniform2f(gl.getUniformLocation(prog, 'px'), 1 / size.w, 1 / size.h);
            gl.uniform1f(gl.getUniformLocation(prog, 'strength'), parseFloat(strengthSelect.value));
            gl.viewport(0, 0, size.w, size.h);

            let running = true;
            const schedule = () => {
                if (!running) return;
                if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(draw);
                else requestAnimationFrame(draw);
            };
            function draw() {
                if (!running) return;
                if (video.readyState >= 2) {
                    gl.bindTexture(gl.TEXTURE_2D, tex);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                }
                schedule();
            }
            stopLoop = () => {
                running = false;
                const ext = gl.getExtension('WEBGL_lose_context');
                if (ext) ext.loseContext();
            };
            draw();
            setStatus(`WebGL Lite active · ${size.nativeW}×${size.nativeH} → ${size.w}×${size.h}`);
        }

        // ---------- WebGPU Anime4K engine ----------
        async function ensureLib() {
            if (lib) return lib;
            const errors = [];
            for (const url of CDN_FALLBACKS) {
                try {
                    const m = await import(url);
                    const candidates = [m, m.default, m.default && m.default.default];
                    const api = candidates.find(c => c && typeof c.render === 'function');
                    if (api) { lib = api; return lib; }
                    const keys = Object.keys(m).concat(m.default ? Object.keys(m.default).map(k => 'default.' + k) : []);
                    errors.push(`${url}: no render export; found [${keys.slice(0, 12).join(', ')}]`);
                } catch (e) {
                    errors.push(`${url}: ${e && e.message}`);
                }
            }
            throw new Error('Could not load Anime4K library (' + errors.join(' | ') + ')');
        }

        async function startWebGPU(video, size, mySession) {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) throw new Error('No WebGPU adapter available on this device');
            const mod = await ensureLib();
            if (mySession !== session) return;

            attachCanvas(size.w, size.h);
            const Preset = mod[modeSelect.value] || mod.ModeA;

            await mod.render({
                video,
                canvas,
                pipelineBuilder: (device, inputTexture) => {
                    const preset = new Preset({
                        device,
                        inputTexture,
                        nativeDimensions: { width: size.nativeW, height: size.nativeH },
                        targetDimensions: { width: canvas.width, height: canvas.height },
                    });
                    return [preset];
                },
            });
            if (mySession !== session) return;
            setStatus(`Anime4K active · ${size.nativeW}×${size.nativeH} → ${size.w}×${size.h}`);
        }

        // ---------- control flow ----------
        async function start() {
            const video = getVideoEl();
            if (!video || !video.videoWidth) { setStatus('Waiting for video to load…'); return; }

            cleanup();
            const mySession = session;
            setStatus('Starting…');

            try {
                const size = getOutputSize(video);
                if (engineSelect.value === 'webgpu') await startWebGPU(video, size, mySession);
                else startWebGL(video, size);
            } catch (err) {
                console.error('Upscaler failed:', err);
                toggle.checked = false;
                cleanup();
                setStatus('Error: ' + ((err && err.message) || err));
            }
        }

        toggle.addEventListener('change', () => {
            if (toggle.checked) start();
            else { cleanup(); setStatus(IDLE_TEXT); }
        });

        const restartIfOn = () => { if (toggle.checked) start(); };
        engineSelect.addEventListener('change', () => { updateUI(); restartIfOn(); });
        modeSelect.addEventListener('change', () => { updateUI(); restartIfOn(); });
        strengthSelect.addEventListener('change', restartIfOn);

        // New file loaded -> rebuild at the new resolution if the toggle is on
        player.on('loadedmetadata', restartIfOn);
    </script>
</body>
</html>
